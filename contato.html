        content="Entre em contato com a Portugas Bacalhau. Fale conosco por e-mail, telefone ou redes sociais.">

        <div class="container">
            <div class="brand">
                <a href="index.html" aria-label="Portugas Bacalhau - Página inicial">
                    <img class="logo" src="assets/img/logoportugas.jpg" alt="Portugas Bacalhau">
                </a>

            <nav class="site-nav" aria-label="Navegação principal">
                <div class="botao">
                    <a href="index.html" class="btn">HOME</a>
                    <a href="sobrenos.html" class="btn">SOBRE NÓS</a>
                    <a href="produtos.html" class="btn">PRODUTOS</a>
                    <a href="contato.html" class="btn" aria-current="page">CONTATO</a>
                </div>
            </nav>
        </div>
    </header>

    <main id="conteudo" class="site-main">
        <div class="container">
            <h1 class="page-title">Entre em contato</h1>

            <section class="card" aria-label="Formulário de contato">
                <div class="contact__images" aria-hidden="true">
                    <img class="contact__image" src="assets/img/bolibaca.jpeg" alt="">
                    <img class="contact__image" src="assets/img/bandeira-portugal.jpg" alt="">
                </div>

                <form class="form" action="mailto:contato@portugasbacalhau.com.br" method="post" enctype="text/plain">
                    <div class="field">
                        <label for="nome"><strong>Nome</strong></label>
                        <input type="text" name="nome" id="nome" autocomplete="name" required>
                    </div>

                    <div class="field">
                        <label for="email"><strong>Email</strong></label>
                        <input type="email" name="email" id="email" autocomplete="email" required>
                    </div>

                    <div class="field">
                        <label for="assunto"><strong>Assunto</strong></label>
                        <input type="text" name="assunto" id="assunto" required>
                    </div>

                    <fieldset class="radio-group">
                        <legend><strong>Você é?</strong></legend>
                        <div class="radio-options">
                            <label>
                                <input type="radio" name="tipo" value="Pessoa física" checked>
                                Pessoa física
                            </label>
                            <label>
                                <input type="radio" name="tipo" value="Pessoa jurídica">
                                Pessoa jurídica
                            </label>
                        </div>
                    </fieldset>

                    <div class="field">
                        <label for="mensagem"><strong>Mensagem</strong></label>
                        <textarea id="mensagem" name="mensagem" placeholder="Deixe sua mensagem" required></textarea>
                    </div>

                    <button class="button" type="submit">Enviar</button>
                    <p class="muted note">
                        Ao enviar, seu aplicativo de e-mail abrirá para concluir a mensagem.
                    </p>
                </form>
            </section>
        </div>
    </main>
